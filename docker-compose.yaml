services:
  account-service:
    container_name: account-service
    build:
      context: .
      dockerfile: mshop-account-service/Dockerfile.dev
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=account-db
      - DB_PORT=5432
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=account_db
    depends_on:
      - account-db
    networks:
      - app-network

  account-db:
    image: postgres:15
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d account_db -U user" ]
      interval: 3s
      timeout: 3s
      retries: 10
    container_name: account-db
    environment:
      POSTGRES_DB: account_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    networks:
      - app-network
    volumes:
      - account-db-data:/var/lib/postgresql/data

  goose-account:
    build:
      context: .
      dockerfile: goose/Dockerfile
    command: ["up"]
    depends_on:
      account-db:
        condition: service_healthy
    volumes:
      - ./migrations/account:/migrations
    entrypoint: ["goose", "postgres", "postgres://user:password@account-db:5432/account_db?sslmode=disable"]
    working_dir: /migrations
    networks:
      - app-network

  transactions-service:
    container_name: transactions-service
    build:
      context: .
      dockerfile: mshop-transactions-service/Dockerfile.dev
    ports:
      - "8081:8081"
    environment:
      - DB_HOST=transactions-db
      - DB_PORT=5432
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=transactions_db
    depends_on:
      - transactions-db
    networks:
      - app-network

  transactions-db:
    image: postgres:15
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d transactions_db -U user" ]
      interval: 3s
      timeout: 3s
      retries: 10
    container_name: transactions-db
    environment:
      POSTGRES_DB: transactions_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    networks:
      - app-network
    volumes:
      - transactions-db-data:/var/lib/postgresql/data

  goose-transactions:
    build:
      context: .
      dockerfile: goose/Dockerfile
    command: ["up"]
    depends_on:
      transactions-db:
        condition: service_healthy
    volumes:
      - ./migrations/transactions:/migrations
    entrypoint: ["goose", "postgres", "postgres://user:password@transactions-db:5432/transactions_db?sslmode=disable"]
    working_dir: /migrations
    networks:
      - app-network

  articles-service:
    container_name: articles-service
    build:
      context: .
      dockerfile: mshop-articles-service/Dockerfile.dev
    ports:
      - "8082:8082"
    environment:
      - DB_HOST=articles-db
      - DB_PORT=5432
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=articles_db
    depends_on:
      - articles-db
    networks:
      - app-network

  articles-db:
    image: postgres:15
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d articles_db -U user" ]
      interval: 3s
      timeout: 3s
      retries: 10
    container_name: articles-db
    environment:
      POSTGRES_DB: articles_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    networks:
      - app-network
    volumes:
      - articles-db-data:/var/lib/postgresql/data

  goose-articles:
    build:
      context: .
      dockerfile: goose/Dockerfile
    command: ["up"]
    depends_on:
      articles-db:
        condition: service_healthy
    volumes:
      - ./migrations/articles:/migrations
    entrypoint: ["goose", "postgres", "postgres://user:password@articles-db:5432/articles_db?sslmode=disable"]
    working_dir: /migrations
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  account-db-data:
  transactions-db-data:
  articles-db-data: